		<title>剧本编辑器</title>
		<link rel="icon" type="image/webp" href="/assets/app-icon.webp" />

		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" />

	</body>
</html>
